# [project] carries only requires-python as a real, machine-readable key —
# bewusst KEIN [build-system]: AI_orchestrator ist eine flache Skript-Sammlung
# (32 Root-Module, kein Package), und `pip install .` scheitert bereits heute
# (vor UND nach dieser Aenderung identisch) an genau dieser Struktur —
# setuptools' Default-Backend verweigert Auto-Discovery bei mehreren
# Top-Level-Verzeichnissen ("Multiple top-level packages discovered in a
# flat-layout"), gemessen 2026-09-04 mit `pip install --dry-run --no-deps .`.
# Ein [build-system] wuerde daran nichts aendern, ohne `packages`/`py_modules`
# explizit zu setzen — das ist hier bewusst nicht gewollt. `name`/`version`
# sind Pflichtfelder von PEP 621, sobald [project] existiert; sie tragen keine
# eigene Bedeutung (kein Release, kein PyPI-Eintrag geplant).
#
# requires-python = 3.12 ist die ZIEL-Untergrenze (passt zu ruff
# target-version / mypy python_version unten) UND empirisch erfuellt:
# `limits.py:85` annotierte `ProviderLimits` in einer Modul-Annotation vor der
# Klassendefinition und warf damit ein NameError auf 3.12/3.13 — die Annotation
# ist seit 2026-09-04 gequotet, `import limits` laeuft auf 3.12, 3.13 und 3.14
# sauber durch (`py -3.12 -c "import limits"` / `py -3.13 -c ...`). 3.10/3.11
# sind auf dieser Maschine nicht testbar und werden deshalb explizit NICHT als
# unterstuetzt beansprucht. Derselbe Vorbehalt steht in README.md Requirements
# und CLAUDE.md Linting & Typing.
#
# Regelauswahl uebernommen von den Schwester-Repos eeg_analysis (pyproject.toml)
# und pyrolyse-1d-model (ruff.toml) — Abweichungen sind unten je Zeile begruendet.
# Baseline gemessen am 2026-09-02 mit ruff 0.16.1 / mypy 2.3.1
# → docs/lint-baseline-2026-09-02.md
#   pip install "ruff==0.16.1" "mypy==2.3.1" types-PyYAML

[project]
name = "ai-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Vereinigung beider Repos, minus NPY (keine numpy-Abhaengigkeit im Repo).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "PL",   # pylint
]
ignore = [
    "E501",     # Zeilenlaenge — Sache des Formatters (Linie eeg_analysis)
    "PLR0913",  # too-many-arguments      (Linie pyrolyse)
    "PLR2004",  # magic-value-comparison  (Linie pyrolyse)
    "PLR0915",  # too-many-statements     (Linie pyrolyse)
    # Deutsche Umlaute und Zeichen wie '→' stehen bewusst in Kommentaren,
    # Docstrings und Prompt-Strings (Linie pyrolyse, hier noch staerker zutreffend).
    "RUF001",   # ambiguous-unicode-character-string
    "RUF002",   # ambiguous-unicode-character-docstring
    "RUF003",   # ambiguous-unicode-character-comment
]
# BEWUSST NICHT uebernommen aus pyrolyse/ruff.toml:
#   N802/N803/N806/N815 — dort ausschliesslich fuer die SI-Suffix-Konvention
#     (temperature_K, pressure_Pa) aus jenem CLAUDE.md §7.2 ignoriert. Dieses Repo
#     hat keine solche Konvention; ein Copy-Paste wuerde echte Naming-Befunde
#     stumm schalten.
#   [lint.per-file-ignores] — waere hier tote Konfiguration: PLR2004 ist bereits
#     global ignoriert, S (flake8-bandit) und T (flake8-print) sind nicht selektiert.
# BEWUSST NICHT ignoriert, obwohl zahlenmaessig dominant:
#   PLC0415 (import-outside-top-level) — trifft das absichtliche Lazy-Import-Muster
#     dieses Repos (Zirkelimport-Vermeidung). Steht als Entscheidungsvorlage im
#     Baseline-Bericht statt als stiller Ignore.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# Linie eeg_analysis (lenient), NICHT pyrolyses `strict = true`: strict misst auf
# diesem Code 3851 Fehler gegen 131 lenient — eine Baseline, mit der niemand
# arbeiten kann. strict ist im Bericht als Ziel benannt, nicht als Startpunkt.
#
# Flache Layout-Notwendigkeit, in keinem der beiden Schwester-Repos noetig
# (beide haben ein src-/model-Package): scripts/, tests/ und hooks/ haben kein
# __init__.py, waehrend die Root-Module top-level sind. Ohne diese zwei Flags
# bricht mypy mit "Source file found twice under different module names" ab.
explicit_package_bases = true
namespace_packages = true
